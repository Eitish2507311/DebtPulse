# Serves the built SPA and proxies /api to the API Gateway.
# In Docker Compose the gateway is reachable as the service name `api-gateway`.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache fingerprinted assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Proxy API calls to the gateway (single entry point → all services).
  location /api/ {
    proxy_pass http://api-gateway:9090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA history fallback — every non-file route serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
