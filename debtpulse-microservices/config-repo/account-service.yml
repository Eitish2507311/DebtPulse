server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/debtpulse_accounts?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: debtpulse_accounts

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

allocation:
  escalation:
    # Cron for the automatic escalation job (EscalationScheduler). Every minute here so the
    # scheduler can be observed during testing/demo; use "0 0 2 * * ?" (nightly 02:00) for
    # production. On-demand runs are always available via POST /api/allocations/escalate.
    cron: "0 */1 * * * ?"

logging:
  file:
    name: logs/spring.log