server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/debtpulse_settlement?createDatabaseIfNotExist=true&serverTimezone=UTC
  flyway:
    locations: classpath:db/migration
    schemas: debtpulse_settlement

logging:
  file:
    name: logs/spring.log

# Settlement approval matrix (haircut % thresholds). The required approval chain is derived from
# these — the client never chooses the level. haircut < l2 -> [L1]; l2..l3 -> [L1,L2]; >= l3 -> [L1,L2,L3].
settlement:
  approval:
    l2-threshold: 10
    l3-threshold: 25
